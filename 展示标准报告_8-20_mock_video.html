.results-column{height:clamp(520px,calc(100vh - 265px),780px);min-width:0;min-height:0;display:flex;flex-direction:column}
.video-column .workflow-strip{width:100%;margin-bottom:0}
.video-column .hero{margin-bottom:0;align-items:stretch;flex-direction:column;gap:14px;padding:18px 20px}
.video-column .hero-side{min-width:0;text-align:left}
.video-column .hero p{max-width:none}
.video-column .toolbar{display:flex;flex-direction:column;align-items:stretch;gap:10px;margin-bottom:0;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;background:var(--paper-cool)}
.video-column .filters,.video-column .controls{width:100%}
.video-column .controls .control{flex:1}
.video-column .difficulty-hint{padding:0}
.video-slot{position:relative;aspect-ratio:16/9;width:100%;margin-bottom:0;overflow:hidden;border:1px solid var(--rule);border-radius:8px;background:linear-gradient(135deg,#1a2332 0%,#253449 52%,#172331 100%);box-shadow:var(--shadow)}
.video-slot video{width:100%;height:100%;display:block;object-fit:contain;background:#172331}
.video-slot::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.04),transparent 48%,rgba(255,255,255,.03));pointer-events:none}
.video-placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#edf3f7;z-index:1;pointer-events:none}
.video-placeholder[hidden]{display:none}.webrtc-source-video{position:fixed;left:-4px;bottom:-4px;width:2px;height:2px;opacity:.001;pointer-events:none}
.video-placeholder-inner{display:grid;gap:8px;justify-items:center}
.video-placeholder-mark{width:48px;height:48px;border:1px solid rgba(237,243,247,.55);border-radius:50%;display:grid;place-items:center;font-family:"JetBrains Mono","SFMono-Regular",monospace;font-size:13px;letter-spacing:.08em;color:#dbeaf7}
.video-placeholder-title{font-family:"Noto Serif SC",serif;font-size:18px;letter-spacing:.08em}.video-placeholder-note{font-family:"JetBrains Mono","SFMono-Regular",monospace;font-size:10px;color:rgba(237,243,247,.7)}
.workflow-strip{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding:12px 14px;border:1px solid var(--rule);border-radius:6px;background:rgba(250,250,247,.96);box-shadow:0 4px 14px rgba(26,35,50,.05);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.workflow-heading{display:flex;align-items:center;gap:7px;flex:0 0 auto;color:var(--ink-mute);font-family:"JetBrains Mono","SFMono-Regular",monospace;font-size:10px;letter-spacing:.04em}.workflow-heading i{width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}.workflow-heading.active i{background:var(--vermilion);box-shadow:0 0 0 5px var(--vermilion-bg)}
.workflow-track{display:flex;align-items:stretch;gap:0;min-width:0;overflow-x:auto;scroll-behavior:smooth;flex:1;padding:2px 0}.workflow-stage{position:relative;display:flex;align-items:center;gap:7px;min-width:116px;padding:5px 13px 5px 8px;color:var(--ink-faint);font-family:"JetBrains Mono","SFMono-Regular",monospace;font-size:9px;white-space:nowrap}.workflow-stage:not(:last-child)::after{content:"";height:1px;width:15px;background:var(--rule);margin-left:4px}.workflow-stage .workflow-light{width:10px;height:10px;border:1px solid var(--rule);border-radius:50%;background:var(--paper);flex:0 0 auto;transition:background .2s,border-color .2s,box-shadow .2s,transform .2s}.workflow-stage.active{color:var(--vermilion)}.workflow-stage.active .workflow-light{border-color:var(--vermilion);background:var(--vermilion);box-shadow:0 0 0 5px var(--vermilion-bg),0 0 16px rgba(22,97,171,.32);transform:scale(1.08)}.workflow-stage.done{color:var(--ink-soft)}.workflow-stage.done .workflow-light{border-color:var(--success);background:var(--success)}.workflow-stage.pending .workflow-light{background:var(--paper-warm)}.workflow-stage.active::after,.workflow-stage.done::after{background:#c5d5e6}.workflow-state{flex:0 0 auto;min-width:78px;text-align:right;color:var(--ink-mute);font-family:"JetBrains Mono","SFMono-Regular",monospace;font-size:9px}
.cards{grid-template-columns:1fr;flex:1;min-height:180px;max-height:none;overflow-y:auto;overflow-x:hidden;padding:3px 6px 22px 2px;scroll-padding-block:32vh}
.cards-empty{grid-column:1/-1;border:1px dashed var(--rule);border-radius:7px;background:var(--paper-cool);padding:30px 18px;text-align:center;color:var(--ink-faint);font-family:"JetBrains Mono","SFMono-Regular",monospace;font-size:10px}
.follow-chip{align-self:flex-start;margin:0 0 10px;border:1px solid #c6d7ea;border-radius:6px;background:var(--vermilion-bg);color:var(--vermilion);padding:9px 12px;font-family:"JetBrains Mono","SFMono-Regular",monospace;font-size:10px;cursor:pointer}
.follow-chip[hidden]{display:none}.follow-chip:hover{border-color:var(--vermilion)}
.item-card.completion-focus{border-color:var(--vermilion);box-shadow:0 0 0 3px var(--vermilion-bg),var(--shadow)}
.item-card.reveal{animation:card-reveal .28s ease-out}@keyframes card-reveal{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(max-width:1050px){.live-layout{grid-template-columns:1fr;min-height:0}.video-column{position:static}.video-slot{position:sticky;top:82px;z-index:10}.results-column{height:auto;min-height:0}.cards{flex:none;max-height:62vh;min-height:220px}}
@media(max-width:800px){.workflow-strip{align-items:flex-start;flex-direction:column;gap:7px}.workflow-track{width:100%}.workflow-state{align-self:flex-end;min-width:0}.video-placeholder-title{font-size:15px}}
@media(prefers-reduced-motion:reduce){.workflow-track{scroll-behavior:auto}.item-card.reveal{animation:none}.workflow-stage .workflow-light{transition:none}}
</style>

async function addWebRTCIceCandidate(candidate){if(!liveReceiverPeer)throw new Error("WebRTC 接收端尚未初始化");await liveReceiverPeer.addIceCandidate(candidate||null)}
function waitForVideoReady(video,timeoutMs=8000){if(video.readyState>=2)return Promise.resolve();return new Promise((resolve,reject)=>{let timer=null;const cleanup=()=>{video.removeEventListener("loadeddata",ready);video.removeEventListener("error",failed);if(timer)clearTimeout(timer)};const ready=()=>{cleanup();resolve()};const failed=()=>{cleanup();reject(new Error("视频样本加载失败"))};video.addEventListener("loadeddata",ready,{once:true});video.addEventListener("error",failed,{once:true});timer=setTimeout(()=>{cleanup();reject(new Error("视频样本加载超时"))},timeoutMs)})}
async function startLocalWebRTCSource(sourceUrl=LOCAL_WEBRTC_SAMPLE){if(!sourceUrl)throw new Error("缺少视频源");if(typeof RTCPeerConnection!=="function")throw new Error("当前浏览器不支持 WebRTC 视频接入");closeLocalSender();const source=document.createElement("video");source.className="webrtc-source-video";source.muted=true;source.loop=true;source.playsInline=true;source.preload="auto";source.src=sourceUrl;source.setAttribute("aria-hidden","true");document.body.append(source);liveSourceVideo=source;try{source.load();await waitForVideoReady(source);await source.play();const capture=source.captureStream||source.mozCaptureStream;if(typeof capture!=="function")throw new Error("当前浏览器不支持视频流采集");const stream=capture.call(source,10),track=stream.getVideoTracks()[0];if(!track)throw new Error("视频源未产生画面轨道");const sender=new RTCPeerConnection({iceServers:[]});liveSenderPeer=sender;sender.addTrack(track,stream);await sender.setLocalDescription(await sender.createOffer());await waitForIceGathering(sender);const answer=await createWebRTCAnswer({type:sender.localDescription.type,sdp:sender.localDescription.sdp},{iceServers:[]},true);await sender.setRemoteDescription(answer);return {senderState:sender.connectionState,receiverState:liveReceiverPeer&&liveReceiverPeer.connectionState}}catch(error){closeLocalSender();setLiveVideoState("failed","视频流连接失败");throw error}}
function liveVideoInputState(){const video=$("live-video"),track=liveRemoteStream&&liveRemoteStream.getVideoTracks()[0];return {receiverConnectionState:liveReceiverPeer&&liveReceiverPeer.connectionState||"closed",senderConnectionState:liveSenderPeer&&liveSenderPeer.connectionState||"closed",hasRemoteStream:Boolean(video&&video.srcObject),trackState:track&&track.readyState||"none",videoWidth:Number(video&&video.videoWidth||0),videoHeight:Number(video&&video.videoHeight||0),currentTime:Number(video&&video.currentTime||0)}}
window.realtimeVideoInput=Object.freeze({acceptOffer:acceptWebRTCOffer,addIceCandidate:addWebRTCIceCandidate,close:closeLiveVideoInput,startLocalSample:startLocalWebRTCSource,getState:liveVideoInputState});

function confidenceText(value){return value==null?"—":`${Math.round(Number(value)*100)}%`}
function formatSeconds(value){const number=Number(value);if(!Number.isFinite(number)||number<0)return "—";const total=Math.round(number);return `${String(Math.floor(total/60)).padStart(2,"0")}:${String(total%60).padStart(2,"0")}`}
function timeRangeText(item){const binding=item.binding||{},range=binding.time_range||{};const start=range.start!=null?range.start:binding.live_start_sec,end=range.end!=null?range.end:binding.live_end_sec;if(start==null&&end==null)return binding.live_timestamp||"—";if(start==null)return formatSeconds(end);if(end==null)return formatSeconds(start);return `${formatSeconds(start)} — ${formatSeconds(end)}`}

function drawerSkeleton(item,detail,message="详细结果将在当前项目完成分析后显示。"){return `<section class="drawer-section"><h3>核验维度 <span>${detail.criterion_count||0} 项</span></h3><div class="skeleton-groups">${(detail.sections||[]).map(section=>`<div class="skeleton-group"><strong>${esc(section.label)}</strong>${section.criterion_count||0} 项</div>`).join("")||`<div class="skeleton-group"><strong>详细核验</strong>等待数据</div>`}</div></section><section class="drawer-section"><div class="empty-note">${esc(message)}</div></section>`}
function drawerCriteria(item,detail){const checks=new Map((detail.checks||[]).map(check=>[String(check.criterion_id),check]));const summary=detail.summary?`<p class="detail-summary">${esc(detail.summary)}</p>`:"";return `<section class="drawer-section"><h3>判断依据 <span>${detail.criterion_count||0} 项</span></h3>${summary}<div class="criteria-list">${(detail.criteria||[]).map(criterion=>{const check=checks.get(String(criterion.criterion_id));return `<div class="criterion-row"><div class="criterion-head"><div class="criterion-label"><span class="criterion-group">${esc(criterion.group)}</span>${esc(criterion.label)}</div>${check?`<span class="check-state ${esc(check.status)}">${esc(checkLabels[check.status]||check.status)}</span>`:`<span class="check-state">待核验</span>`}</div><div class="criterion-basis">${esc(criterion.basis)}</div><div class="criterion-boundary">${esc(criterion.boundary)}</div>${check?`<div class="check-observation">${esc(check.observation||"")}</div>${check.reason?`<div class="check-reason">${esc(check.reason)}</div>`:""}<div class="check-line"><span class="check-confidence">置信度 ${confidenceText(check.confidence)}</span></div>${(check.evidence_ids||[]).length?`<div class="evidence-ref-list">${check.evidence_ids.map(id=>detailEvidenceRef(item,id)).join("")}</div>`:""}`:""}</div>`}).join("")}</div></section>`}
function drawerEvidence(item){if(evidenceMediaMode==="video"){const video=item.binding&&item.binding.video_evidence;return `<section class="drawer-section"><h3>证据链 <span>${video?1:0} 条</span></h3>${video?videoEvidenceMarkup(item,state.indexOf(item),true):`<div class="empty-note">当前项目暂无视频证据</div>`}</section>`}const evidence=item.binding&&item.binding.evidence||[];if(!evidence.length)return `<section class="drawer-section"><h3>证据链</h3><div class="empty-note">当前项目暂无图像证据</div></section>`;const sorted=[...evidence].sort((a,b)=>{const ao=a.order_index==null?9999:Number(a.order_index),bo=b.order_index==null?9999:Number(b.order_index);return ao-bo||(Number(a.timestamp_sec)||0)-(Number(b.timestamp_sec)||0)});return `<section class="drawer-section"><h3>证据链 <span>${sorted.length} 条</span></h3><div class="evidence-grid">${sorted.map(e=>evidenceButtonMarkup(item,e,state.indexOf(item))).join("")}</div></section>`}
function drawerAnalysis(item){if(!isTerminal(item))return "";const profile=item.analysis_profile||{};const tools=(item.analysis_tools||[]).map(tool=>`<span class="tool-chip">${esc(tool.label||tool.tool_id)}</span>`).join("");const features=(profile.complexity_features||[]).map(feature=>esc(feature)).join(" · ");return `<section class="drawer-section"><h3>分析链</h3><div class="tool-list">${tools||`<span class="tool-chip">工具链整理中</span>`}</div><div class="profile-line">实际分析任务 ${profile.actual_analysis_task_count!=null?esc(profile.actual_analysis_task_count):"—"} 个${features?`<br>复杂度特征：${features}`:""}</div></section>`}
function drawerRisks(detail){const risks=[...new Set(detail.risk_boundaries||[])].filter(Boolean);return `<section class="drawer-section"><h3>易混淆与排除</h3>${risks.length?`<ul class="risk-list">${risks.map(risk=>`<li>${esc(risk)}</li>`).join("")}</ul>`:`<div class="empty-note">暂无补充提示</div>`}</section>`}

function renderDrawer(index){const item=state[index];if(!item)return;const detail=item.detail||{state:detailState(item),sections:[],criterion_count:0},drawerBody=$("drawer-body"),drawerSignature=signature(item);drawerIndex=index;$("drawer-kicker").textContent=`项目 ${item.item_number} · 详细核验`;$("drawer-title").textContent=item.display_name;$("drawer-meta").innerHTML=`<span>${esc(item.status)}</span><span>·</span><span>修订 ${esc(item.binding&&item.binding.revision||0)}</span>`;if(drawerBody.dataset.itemIndex!==String(index)||drawerBody.dataset.renderSignature!==drawerSignature){rememberVideoPositions(drawerBody);const time=timeRangeText(item);const difficulty=isTerminal(item)?(item.difficulty_label||labels[item.difficulty]||"—"):"—";const detailLabel=detailStateLabels[detail.state]||detail.state||"等待核验";const header=`<div class="drawer-status"><span class="status-badge ${cls(item.status)}">${esc(item.status)}</span>${isTerminal(item)?`<span class="score-badge ${scoreFor(item)===0?"zero":""}">${scoreFor(item)} / 1 分</span>`:""}</div><div class="drawer-grid"><div class="drawer-stat"><label>现场时间范围</label><strong>${esc(time)}</strong></div><div class="drawer-stat"><label>时间置信度</label><strong>${confidenceText(item.binding&&item.binding.time_confidence)}</strong></div><div class="drawer-stat"><label>详细状态</label><strong>${esc(detailLabel)}</strong></div><div class="drawer-stat"><label>评价难度</label><strong>${esc(difficulty)}</strong></div></div>`;let body=header;if(!isTerminal(item)){body+=drawerSkeleton(item,detail)}else{if(isCompleted(item)&&detail.state==="unlocked"&&detail.high_level_evaluation)body+=`<section class="drawer-section"><h3>项目评价</h3><div class="high-level">${esc(detail.high_level_evaluation)}</div></section>`;if(item.status==="待人工确认"&&detail.unresolved_summary)body+=`<section class="drawer-section"><h3>待确认事项</h3><div class="unresolved">${esc(detail.unresolved_summary)}</div></section>`;if(detail.state==="unlocked")body+=drawerCriteria(item,detail);else body+=dra function openDetail(index){current=index;render();pendingAutoplayIndex=index;renderDrawer(index);setTimeout(()=>$('drawer-close').focus(),0)}

function findEvidenceFromButton(button){const item=state[Number(button.dataset.itemIndex)];return item?evidenceById(item,button.dataset.evidenceId):null}
function showHover(button,fromKeyboard=false){const evidence=findEvidenceFromButton(button);if(!evidence||evidence.kind==="video"||(!fromKeyboard&&window.matchMedia("(pointer:coarse)").matches))return;hoverButton=button;const media=$("hover-media");media.innerHTML=evidence.src?`<img src="${evidence.src}" alt="">`:`<div class="preview-placeholder">暂无图像</div>`;$("hover-phase").textContent=`${evidenceLabel(evidence)}${evidence.timestamp?` · ${evidence.timestamp}`:""}`;$("hover-confidence").textContent=confidenceText(evidence.confidence);const preview=$("hover-preview");preview.hidden=false;const rect=button.getBoundingClientRect(),width=Math.min(310,Math.max(120,window.innerWidth-24)),height=Math.min(270,Math.max(150,window.innerHeight-24));preview.style.width=`${width}px`;let left=rect.right+12,top=rect.top;if(left+width>window.innerWidth-12)left=rect.left-width-12;if(top+height>window.innerHeight-12)top=window.innerHeight-height-12;preview.style.left=`${Math.max(12,Math.min(left,Math.max(12,window.innerWidth-width-12)))}px`;preview.style.top=`${Math.max(12,Math.min(top,Math.max(12,window.innerHeight-height-12)))}px`}

function closeLightbox(){pauseEvidencePlayers();$("lightbox-media").innerHTML="";$("lightbox").hidden=true;if(drawerIndex===null)document.body.classList.remove("locked");pendingAutoplayIndex=current;syncEvidencePlayers()}
