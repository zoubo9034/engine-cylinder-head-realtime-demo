<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#073b78">
<title>发动机气缸盖拆装智能实训分析</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap");
:root {
  --blue: #0056d2;
  --blue-bright: #2f80ff;
  --blue-hover: #0044b8;
  --blue-soft: #e8f1ff;
  --warm: #ffb25a;
  --ink: #1f1f1f;
  --ink-2: #2d2d2d;
  --muted: #5e5e5e;
  --faint: #8a8a8a;
  --line: #e4eaf2;
  --paper: #ffffff;
  --page: #eef3fb;
  --success: #1e7a46;
  --success-bg: #e9f6ee;
  --warning: #9a6700;
  --warning-bg: #fff6e5;
  --error: #b32222;
  --error-bg: #fdecec;
  --radius: 14px;
  --canvas-width: 1920px;
  --canvas-height: 1080px;
  --canvas-gutter: 24px;
  --page-pad: 32px;
  --content-width: 1856px;
  --live-row: 768px;
  --shadow: 0 12px 32px rgba(15, 55, 120, 0.08);
  --focus: 0 0 0 3px rgba(0, 86, 210, 0.28);
  --grad-blue: linear-gradient(135deg, #2f80ff 0%, #0056d2 58%, #083d8a 100%);
  --font: "Source Sans 3", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  --glass: blur(18px) saturate(160%);
}

* { box-sizing: border-box; }
html {
  min-width: 320px;
  background: #eaf6f3;
  scrollbar-width: thin;
  scrollbar-color: #b7d4f8 #eef5ff;
}
html::-webkit-scrollbar { width: 10px; }
html::-webkit-scrollbar-track { background: #eef5ff; }
html::-webkit-scrollbar-thumb {
  background: #b7d4f8;
  border-radius: 99px;
}
html::-webkit-scrollbar-thumb:hover { background: #9cc4f4; }
body {
  margin: 0;
  min-width: 320px;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  color: var(--ink);
  background:
    radial-gradient(1200px 420px at 88% -8%, rgba(47, 128, 255, 0.14), transparent 58%),
    linear-gradient(180deg, #d7ebff 0%, #eaf2fb 38%, #e8f5f2 100%);
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body.locked { overflow: hidden; }
.canvas-host {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  width: 100vw;
  height: calc(var(--canvas-height) * var(--canvas-scale, 1) + 24px);
  min-height: 100vh;
  padding-top: 12px;
  overflow: hidden;
}
.page-canvas {
  width: var(--canvas-width);
  height: var(--canvas-height);
  flex: 0 0 var(--canvas-width);
  overflow: hidden;
  transform: scale(var(--canvas-scale, 1));
  transform-origin: top center;
  will-change: transform;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: none; box-shadow: var(--focus); }
[hidden] { display: none !important; }

.pulse {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #2a9d5c;
  box-shadow: 0 0 0 0 rgba(42, 157, 92, 0.4);
  animation: pulse 1.7s infinite;
}
@keyframes pulse { 70% { box-shadow: 0 0 0 8px transparent; } }

.course-banner {
  position: relative;
  width: var(--canvas-width);
  height: 180px;
  margin: 0;
  overflow: hidden;
  color: #fff;
  background:
    radial-gradient(720px 280px at 12% 118%, rgba(255, 178, 90, 0.22), transparent 58%),
    linear-gradient(118deg, #1468c8 0%, #1e7ae8 42%, #4aa3ff 76%, #7ec4ff 100%);
}
.banner-art {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.banner-ring,
.banner-disc,
.banner-slash {
  position: absolute;
  display: block;
}
.banner-ring {
  top: -72px;
  right: 8%;
  width: 280px;
  height: 280px;
  border: 18px solid rgba(255, 255, 255, 0.12);
  border-radius: 50%;
}
.banner-disc {
  right: 18%;
  bottom: -90px;
  width: 220px;
  height: 220px;
  background: radial-gradient(circle at 30% 30%, #ffd089 0%, #ff9a3c 42%, transparent 68%);
  opacity: 0.85;
  border-radius: 50%;
}
.banner-slash {
  top: 0;
  right: 0;
  width: 42%;
  height: 100%;
  background: linear-gradient(160deg, transparent 28%, rgba(255, 255, 255, 0.08) 28% 32%, transparent 32% 62%, rgba(255, 178, 90, 0.16) 62% 68%, transparent 68%);
}
.banner-inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: var(--canvas-width);
  height: 180px;
  margin: 0;
  padding: 14px var(--page-pad) 16px;
}
.banner-top {
  display: flex;
  align-items: center;
  gap: 16px;
}
.banner-logo {
  display: block;
  height: 28px;
  width: auto;
  flex-shrink: 0;
}
.live-pill {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  gap: 8px;
  color: rgba(255, 255, 255, 0.92);
  font-size: 14px;
}
.live-pill .pulse {
  background: #fff;
  box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.45);
}
.banner-body {
  display: block;
  max-width: 960px;
  flex: 1;
  padding-top: 0;
}
.crumbs {
  margin: 0 auto 0 0;
  color: rgba(255, 255, 255, 0.72);
  font-size: 13px;
}
.crumbs span { margin: 0 6px; opacity: 0.6; }
.course-banner h1 {
  margin: 0 0 6px;
  max-width: 960px;
  font-size: 31px;
  font-weight: 700;
  line-height: 1.18;
  letter-spacing: -0.03em;
  text-shadow: 0 8px 24px rgba(0, 20, 60, 0.25);
}
.banner-lead {
  max-width: 760px;
  margin: 0;
  color: rgba(255, 255, 255, 0.82);
  font-size: 14px;
}
.banner-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.banner-meta span {
  padding: 4px 10px;
  color: #fff;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.18), rgba(255, 255, 255, 0.08));
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 999px;
  font-size: 12px;
}
.shell {
  width: var(--canvas-width);
  height: 900px;
  margin: 0;
  padding: 12px var(--page-pad) 10px;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 12px;
  margin: 0 0 10px;
}
.metric {
  position: relative;
  min-width: 0;
  overflow: hidden;
  isolation: isolate;
  min-height: 70px;
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.62);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(8, 36, 86, 0.08);
  -webkit-backdrop-filter: var(--glass);
  backdrop-filter: var(--glass);
}
.metric::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 62%;
  background: linear-gradient(180deg, transparent 0%, rgba(0, 86, 210, 0.18) 100%);
  pointer-events: none;
  z-index: 0;
}
.metric:nth-child(2)::after { background: linear-gradient(180deg, transparent, rgba(30, 122, 70, 0.18)); }
.metric:nth-child(3)::after { background: linear-gradient(180deg, transparent, rgba(245, 158, 11, 0.2)); }
.metric:nth-child(4)::after { background: linear-gradient(180deg, transparent, rgba(47, 128, 255, 0.2)); }
.metric:nth-child(5)::after { background: linear-gradient(180deg, transparent, rgba(255, 122, 60, 0.18)); }
.metric-label,
.metric-value { position: relative; z-index: 1; color: #333333; }
.metric-label { font-size: 12px; }
.metric-value {
  margin-top: 4px;
  font-size: 18px;
  font-weight: 700;
  line-height: 1.3;
  overflow-wrap: anywhere;
}

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .metric { background: rgba(255, 255, 255, 0.94); }
}

.live-layout {
  display: grid;
  grid-template-columns: 220px 400px 1188px;
  grid-template-rows: var(--live-row);
  gap: 24px;
  align-items: stretch;
  height: var(--live-row);
}
.live-layout.awaiting-start {
  grid-template-columns: 220px 1612px;
}
.live-layout.timeline-collapsed:not(.awaiting-start) {
  grid-template-columns: 440px 1392px;
}
.live-layout.timeline-collapsed.awaiting-start {
  grid-template-columns: 1856px;
}
.live-layout.timeline-collapsed .course-column {
  display: none;
}
.live-layout.awaiting-start .results-column {
  display: none;
}
.course-fab {
  position: fixed;
  left: 18px;
  top: 46%;
  z-index: 25;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  width: 58px;
  height: 58px;
  padding: 0;
  color: var(--blue);
  background: var(--blue-soft);
  border: 1px solid #c5d8f7;
  border-radius: 50%;
  box-shadow: 0 8px 20px rgba(0, 86, 210, 0.14);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.1;
  cursor: pointer;
}
.course-fab:hover {
  color: var(--blue-hover);
  background: #d7e6ff;
  border-color: #b7d4f8;
}
.course-column,
.stage-column,
.results-column {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  min-height: 0;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(180deg, #ffffff, #f6f9ff);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.course-column { padding: 6px 0 10px; }
.stage-column { padding: 16px; }
.results-column {
  gap: 0;
  padding: 12px;
}
.panel-head {
  margin: 0 0 10px;
  color: #333333;
  font-size: 13px;
  font-weight: 700;
}
.stage-panel {
  padding: 16px;
  background: linear-gradient(180deg, #ffffff, #f6f9ff);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.stage-column .stage-panel {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
  padding: 0;
  background: none;
  border: 0;
  box-shadow: none;
}
.video-slot {
  position: relative;
  flex: 0 0 auto;
  align-self: center;
  width: 250px;
  height: 375px;
  min-height: 375px;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: linear-gradient(135deg, #0d3d86 0%, #1a73e8 55%, #4aa3ff 100%);
}
.video-slot video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #0d3d86;
}
.video-placeholder {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: grid;
  place-items: center;
  color: #fff;
  pointer-events: none;
  text-align: center;
}
.video-placeholder-inner { display: grid; gap: 8px; justify-items: center; }
.video-placeholder-mark {
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
  color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.45);
  border-radius: 50%;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
.video-placeholder-title { font-size: 18px; font-weight: 700; }
.video-placeholder-note { color: rgba(255, 255, 255, 0.78); font-size: 13px; }
.webrtc-source-video { position: fixed; left: -4px; bottom: -4px; width: 2px; height: 2px; opacity: .001; pointer-events: none; }
.live-controls {
  display: flex;
  flex-wrap: wrap;
  flex: 0 0 auto;
  gap: 10px;
  margin-top: 12px;
}
.live-controls .control {
  flex: 1;
  min-height: 44px;
  padding: 10px 18px;
  font-size: 16px;
}
.workflow-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.72);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  -webkit-backdrop-filter: var(--glass);
  backdrop-filter: var(--glass);
}
.workflow-heading {
  display: flex;
  align-items: center;
  gap: 7px;
  flex: 0 0 auto;
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.workflow-heading i {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--faint);
}
.workflow-heading.active i {
  background: var(--blue);
  box-shadow: 0 0 0 5px var(--blue-soft);
}
.workflow-track {
  display: flex;
  align-items: stretch;
  flex: 1;
  min-width: 0;
  overflow-x: auto;
  padding: 2px 0;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: #b7d4f8 #eef5ff;
}
.workflow-stage {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 108px;
  padding: 4px 12px 4px 6px;
  color: var(--faint);
  font-size: 12px;
  white-space: nowrap;
}
.workflow-stage:not(:last-child)::after {
  content: "";
  width: 12px;
  height: 1px;
  margin-left: 4px;
  background: var(--line);
}
.workflow-stage .workflow-light {
  width: 10px;
  height: 10px;
  flex: 0 0 auto;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 50%;
  transition: background 200ms, border-color 200ms, box-shadow 200ms, transform 200ms;
}
.workflow-stage.active { color: var(--blue); }
.workflow-stage.active .workflow-light {
  background: var(--blue);
  border-color: var(--blue);
  box-shadow: 0 0 0 5px var(--blue-soft);
  transform: scale(1.08);
}
.workflow-stage.done { color: var(--success); }
.workflow-stage.done .workflow-light {
  background: var(--success);
  border-color: var(--success);
}
.workflow-stage.pending .workflow-light { background: var(--page); }
.workflow-state {
  flex: 0 0 auto;
  min-width: 72px;
  color: var(--muted);
  font-size: 12px;
  text-align: right;
}
.stage-column .hero {
  flex: 0 0 auto;
  margin: 0;
  padding: 12px 0 0;
  grid-template-columns: minmax(0, 1fr) minmax(120px, 160px);
  gap: 10px 16px;
  background: none;
  border: 0;
  border-top: 1px solid var(--line);
  border-radius: 0;
  box-shadow: none;
}
.stage-column .hero .panel-head { grid-column: 1 / -1; margin-bottom: 2px; }
.stage-column .hero-side { text-align: left; }
.stage-column .hero h2 { font-size: 20px; }
.timeline {
  align-self: stretch;
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  position: static;
  max-height: none;
  overflow: hidden;
  padding: 10px 10px 6px;
  background: none;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.timeline-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 4px 6px 10px;
  flex-shrink: 0;
}
.timeline-title {
  min-width: 0;
  font-size: 16px;
  font-weight: 700;
}
.timeline-toggle {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  color: var(--blue);
  background: var(--blue-soft);
  border: 0;
  border-radius: 8px;
  cursor: pointer;
}
.timeline-toggle:hover { background: #d7e6ff; }
.timeline-list {
  display: flex;
  flex-direction: column;
  min-height: 0;
  overflow: auto;
  scrollbar-width: thin;
  scrollbar-color: #b7d4f8 #eef5ff;
}
.timeline-list::-webkit-scrollbar { width: 8px; }
.timeline-list::-webkit-scrollbar-track {
  background: #eef5ff;
  border-radius: 99px;
}
.timeline-list::-webkit-scrollbar-thumb {
  background: #b7d4f8;
  border-radius: 99px;
}
.timeline-list::-webkit-scrollbar-thumb:hover { background: #9cc4f4; }
.timeline-btn {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 10px 12px;
  color: var(--ink-2);
  text-align: left;
  background: transparent;
  border: 0;
  cursor: pointer;
}
.timeline-btn:hover { background: var(--page); }
.timeline-btn.active {
  background: var(--blue-soft);
  color: var(--blue);
}
.timeline-no {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  color: var(--muted);
  background: var(--page);
  border-radius: 50%;
  font-size: 12px;
  font-weight: 700;
}
.timeline-btn.active .timeline-no {
  color: #fff;
  background: var(--blue);
}
.timeline-name { overflow: hidden; font-size: 14px; text-overflow: ellipsis; white-space: nowrap; }
.timeline-state { display: block; margin-top: 2px; color: var(--faint); font-size: 11px; }
.mini-dot {
  width: 8px;
  height: 8px;
  background: #fff;
  border: 1px solid var(--faint);
  border-radius: 50%;
}
.mini-dot.done { border-color: var(--success); background: var(--success); }
.mini-dot.busy { border-color: var(--blue); background: var(--blue); animation: pulse 1.5s infinite; }
.mini-dot.review { border-color: var(--warning); background: var(--warning); }
.mini-dot.located { border-color: var(--blue); background: var(--blue-soft); }

.hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(220px, 280px);
  align-items: center;
  gap: 40px;
  width: 100%;
  margin: 0 0 32px;
  padding: 28px 32px;
  background:
    linear-gradient(135deg, rgba(47, 128, 255, 0.08), transparent 42%),
    linear-gradient(180deg, #ffffff, #f7faff);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}
.hero-copy { min-width: 0; }
.hero-kicker { color: #333333; font-size: 13px; font-weight: 700; }
.hero h2 { margin: 6px 0 8px; color: #333333; font-size: 24px; font-weight: 700; line-height: 1.25; }
.hero p { max-width: none; margin: 0; color: #333333; font-size: 15px; }
.hero-side { min-width: 0; text-align: right; }
.stage-label { color: #333333; font-size: 13px; }
.stage-value { margin-top: 4px; color: #333333; font-size: 20px; font-weight: 700; }
.progress { height: 10px; margin-top: 12px; overflow: hidden; background: #e4ecf8; border-radius: 99px; }
.progress i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #ffb25a, #2f80ff 42%, #0056d2);
  border-radius: inherit;
  transition: width 280ms ease;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 20px;
}
.stage-column .toolbar {
  flex: 0 0 auto;
  margin: 0;
  justify-content: flex-start;
}
.stage-column .workflow-strip {
  flex: 0 0 auto;
}
.filters, .controls { display: flex; flex-wrap: wrap; gap: 8px; }
.filters:not(.ready) .chip {
  color: var(--muted);
  background: #fff;
  border-color: var(--line);
  cursor: default;
  pointer-events: none;
}
.filters:not(.ready) .chip:hover {
  color: var(--muted);
  background: #fff;
  border-color: var(--line);
}

.chip, .control, .detail-trigger {
  padding: 8px 14px;
  color: var(--ink-2);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 999px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: background-color 160ms ease, border-color 160ms ease, color 160ms ease, transform 160ms ease;
}
.chip:hover, .control:hover, .detail-trigger:hover {
  color: var(--blue);
  background: var(--blue-soft);
  border-color: #c5d8f7;
}
.chip.active {
  color: #fff;
  background: var(--grad-blue);
  border-color: transparent;
}
.control.primary {
  color: #fff;
  background: var(--grad-blue);
  border-color: transparent;
  box-shadow: 0 8px 18px rgba(0, 86, 210, 0.22);
}
.control.primary:hover { color: #fff; background: linear-gradient(135deg, #4a90ff, #004bb8); border-color: transparent; }

.cards {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  flex: 1;
  gap: 22px;
  min-height: 0;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 3px 6px 8px 2px;
  scroll-padding-block: 260px;
  scrollbar-width: thin;
  scrollbar-color: #b7d4f8 #eef5ff;
}
.cards::-webkit-scrollbar { width: 8px; }
.cards::-webkit-scrollbar-track {
  background: #eef5ff;
  border-radius: 99px;
}
.cards::-webkit-scrollbar-thumb {
  background: #b7d4f8;
  border-radius: 99px;
}
.cards-empty {
  grid-column: 1 / -1;
  display: grid;
  place-items: center;
  gap: 16px;
  height: 100%;
  min-height: 0;
  padding: 24px 18px;
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 0;
  text-align: center;
}
.wait-orb {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 35% 30%, #9cc8ff 0%, #2f80ff 42%, #0056d2 100%);
  box-shadow: 0 0 0 0 rgba(0, 86, 210, 0.32);
  animation: wait-breathe 2s ease-in-out infinite;
}
.wait-label {
  color: #333333;
  font-size: 15px;
  font-weight: 600;
}
@keyframes wait-breathe {
  0%, 100% {
    transform: scale(0.92);
    box-shadow: 0 0 0 0 rgba(0, 86, 210, 0.34);
    opacity: 0.88;
  }
  50% {
    transform: scale(1.08);
    box-shadow: 0 0 0 18px rgba(0, 86, 210, 0);
    opacity: 1;
  }
}
.item-card {
  position: relative;
  flex: 0 0 auto;
  height: auto;
  min-width: 0;
  padding: 0;
  overflow: hidden;
  background: #ffffff;
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(15, 55, 120, 0.06);
  transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
}
.item-card::before {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  width: 4px;
  background: #c7d3e3;
  content: "";
}
.item-card:hover {
  transform: translateY(-1px);
  border-color: #c3d4eb;
  box-shadow: 0 12px 28px rgba(15, 55, 120, 0.10);
}
.item-card.current {
  border-color: #8ab5ed;
  background: #ffffff;
  box-shadow: 0 12px 30px rgba(0, 86, 210, 0.14);
}
.item-card.current::before { background: var(--blue); }
.item-card.review { background: #fffaf2; border-color: #efd39a; }
.item-card.review::before { background: var(--warning); }
.item-card.completion-focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-soft), var(--shadow);
}
.item-card.reveal { animation: card-reveal 0.28s ease-out; }
@keyframes card-reveal {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 20px 22px 16px 24px;

}
.card-actions { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 6px; }
.item-id { display: flex; align-items: center; gap: 10px; }
.item-no {
  display: grid;
  flex: 0 0 auto;
  place-items: center;
  width: 38px;
  height: 38px;
  color: #ffffff;
  background: var(--grad-blue);
  border-radius: 8px;
  box-shadow: 0 5px 12px rgba(0, 86, 210, 0.18);
  font-size: 15px;

}
.item-title { color: #202b3a; font-size: 18px; font-weight: 750; line-height: 1.3; }
.difficulty {
  display: inline-block;

  background: var(--page);
  border-radius: 99px;

}
.difficulty.difficult { color: var(--error); background: var(--error-bg); }
.difficulty.medium { color: var(--warning); background: var(--warning-bg); }
.difficulty.easy { color: var(--success); background: var(--success-bg); }
.status-badge, .score-badge {
  padding: 4px 9px;

}
.status-badge { color: var(--muted); background: var(--page); }
.status-badge.pending { font-size: 11px; }
.status-badge.done { color: var(--success); background: var(--success-bg); }
.status-badge.busy, .status-badge.located { color: var(--blue); background: var(--blue-soft); }
.status-badge.review { color: var(--warning); background: var(--warning-bg); }
.score-badge { color: #ffffff; background: var(--success); box-shadow: 0 3px 8px rgba(30, 122, 70, 0.14); }
.score-badge.zero { color: var(--error); background: var(--error-bg); }
.target {
  margin: 16px 22px 0 24px;

}
.target p { margin: 4px 0 0; }
.target-label { display: block; color: var(--blue); font-size: 11px; font-weight: 750; letter-spacing: .08em; }
.binding-line {

}
.binding-meta {

}
.binding-meta strong { color: var(--ink); font-size: 13px; font-weight: 700; }
.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 14px;
  padding: 13px 22px 15px 24px;
  background: #fbfcfe;
  border-top: 1px solid #edf1f7;
}
.card-body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 280px;
  align-items: start;
  gap: 18px;

}
.card-summary, .card-evidence { min-width: 0; }
.card-evidence { display: flex; justify-content: center; }
.card-body .target,
.card-body .binding-line,
.card-body .analysis-box,
.card-body .evidence-box { margin-right: 0; margin-left: 0; }

.card-body .evidence-box { width: 100%; margin-top: 0; }
.detail-trigger {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 34px;
  padding: 7px 12px;
  color: #ffffff;
  background: var(--blue);
  border-color: var(--blue);
  border-radius: 7px;
  box-shadow: 0 4px 10px rgba(0, 86, 210, 0.14);

}
.detail-trigger:hover { color: #ffffff; background: var(--blue-hover); border-color: var(--blue-hover); }
.detail-trigger svg { width: 14px; height: 14px; }

.evidence-box { margin: 14px 22px 0 24px; padding: 12px; background: #f4f7fb; border: 1px solid #e4eaf2; border-radius: 9px; }
.evidence-box.busy {
  min-height: 72px;

  color: var(--muted);
  font-size: 13px;
}
.slot-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.slot { padding: 2px 7px; color: var(--muted); background: #fff; border: 1px solid var(--line); border-radius: 99px; font-size: 12px; }
.slot.bound { color: var(--success); border-color: #bde3cb; background: var(--success-bg); }
.slot.empty { color: var(--faint); }
.evidence-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.evidence-thumb {
  position: relative;
  min-width: 0;
  aspect-ratio: 16 / 10;
  padding: 0;
  overflow: hidden;
  background: #ececec;
  border: 0;
  border-radius: 4px;
  cursor: zoom-in;
}
.evidence-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.evidence-thumb .empty-note { display: grid; place-items: center; height: 100%; }
.evidence-thumb .tile-meta {
  position: absolute;
  right: 0; bottom: 0; left: 0;
  padding: 16px 6px 5px;
  color: #fff;
  background: linear-gradient(transparent, rgba(0, 0, 0, 0.72));

}
.evidence-thumb .confidence { float: right; color: #cfe0ff; }
.follow-chip {

  z-index: 5;

  grid-template-columns: 34px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  margin: 0 0 10px;
  padding: 10px 12px;
  border: 1px solid #bcd4f5;
  border-radius: 10px;
  background: rgba(244, 249, 255, .97);
  color: #24405f;
  box-shadow: 0 8px 22px rgba(0, 86, 210, .10);
  backdrop-filter: blur(10px);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.follow-chip[hidden] { display: none; }
.follow-chip:hover { border-color: #84afe8; background: #ffffff; }
.follow-chip-icon { display: grid; place-items: center; width: 34px; height: 34px; color: #ffffff; background: var(--success); border-radius: 50%; font-size: 16px; font-weight: 750; }
.follow-chip-copy { display: grid; min-width: 0; }
.follow-chip-copy strong { overflow: hidden; color: #233850; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
.follow-chip-copy small { margin-top: 1px; color: var(--muted); font-size: 11px; }
.follow-chip-action { display: inline-flex; align-items: center; gap: 5px; color: var(--blue); font-size: 12px; font-weight: 750; white-space: nowrap; }
.follow-chip-action svg { width: 13px; height: 13px; }
.evidence-video-wrap {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 8px;
  background:
    radial-gradient(circle at 50% 42%, #193d65 0%, transparent 58%),
    linear-gradient(160deg, #0d2848 0%, #07172d 72%);
  aspect-ratio: 9 / 16;
}
.evidence-video-backdrop,
.evidence-video-shade { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.evidence-video-backdrop { z-index: 0; opacity: 0; transition: opacity 180ms ease; }
.evidence-video-backdrop[data-state="ready"] { opacity: 1; }
.evidence-video-shade { z-index: 1; background: linear-gradient(180deg, rgba(3,14,30,.16), rgba(3,14,30,.36)); }
.item-card .evidence-video-wrap { width: 240px; max-width: 100%; margin: 0 auto; }
.lightbox .evidence-video-wrap { width: 100%; align-self: center; }
.evidence-video { position: relative; z-index: 2; display: block; width: 100%; height: 100%; object-fit: contain; background: transparent; }
.video-playback-status:not(:empty) {
  position: absolute;
  left: 10px;
  right: 10px;
  bottom: 42px;
  padding: 8px 10px;
  border-radius: 6px;
  background: rgba(7, 23, 45, .9);
  color: #fff;
  text-align: center;
  font-size: 11px;
  pointer-events: none;
  z-index: 3;
}
.evidence-video-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 10px;
  color: var(--muted);
  font-size: 12px;
}
.evidence-video-spec { display: grid; min-width: 0; }
.evidence-video-spec strong { color: #35465a; font-size: 12px; }
.evidence-video-spec small { margin-top: 1px; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
.evidence-expand {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 6px;
  min-height: 32px;
  padding: 6px 10px;
  color: var(--blue);
  background: #ffffff;
  border: 1px solid #bcd4f5;
  border-radius: 7px;
  box-shadow: 0 3px 8px rgba(0, 86, 210, .08);
  cursor: zoom-in;
  font-size: 12px;
  font-weight: 700;
}
.evidence-expand:hover { color: #ffffff; background: var(--blue); border-color: var(--blue); }
.evidence-expand svg { width: 14px; height: 14px; }
.video-service-note {
  display: grid;
  place-items: center;
  min-height: 150px;
  padding: 18px;
  text-align: center;
  color: var(--muted);
  background: var(--page);
}
.sequence { display: flex; gap: 4px; margin-top: 8px; }
.sequence span {
  flex: 1;
  padding: 5px 2px;
  color: var(--muted);
  text-align: center;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
  font-size: 12px;
}
.sequence span.on { color: var(--blue); background: var(--blue-soft); border-color: #c5d8f7; }
.analysis-box {
  margin: 12px 22px 0 24px;
  padding: 10px 12px;
  background: linear-gradient(90deg, #e8f1ff, #f7faff);
  border-radius: 0 8px 8px 0;
  border-left: 3px solid var(--blue);
}
.analysis-title { margin-bottom: 8px; color: var(--blue); font-size: 12px; font-weight: 700; }
.tool-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tool-chip { padding: 3px 7px; color: var(--ink-2); background: #fff; border-radius: 99px; font-size: 12px; }
.profile-line { margin-top: 8px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.explain { margin-top: 8px; color: var(--muted); font-size: 13px; }
.empty-note { padding: 12px 0; color: var(--faint); font-size: 13px; text-align: center; }

.drawer-backdrop, .lightbox {
  position: fixed;
  inset: 0;
  isolation: isolate;
  background: rgba(12, 31, 56, 0.58);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.drawer-backdrop { z-index: 100; }
.lightbox { z-index: 120; }
.drawer-backdrop[hidden], .lightbox[hidden], .hover-preview[hidden] { display: none; }
.detail-drawer {
  position: fixed;
  top: 0; right: 0;
  display: flex;
  flex-direction: column;
  width: min(680px, 94vw);
  height: 100dvh;
  overflow: hidden;
  background: #fff;
  border-left: 1px solid rgba(255, 255, 255, .55);
  box-shadow: -18px 0 55px rgba(6, 24, 48, 0.26);
}
.drawer-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 20px 22px 16px;
  background: linear-gradient(180deg, #f4f8ff, #ffffff);
  border-bottom: 1px solid var(--line);
}
.drawer-kicker { color: var(--blue); font-size: 12px; font-weight: 700; }
.drawer-title { margin: 4px 0; font-size: 22px; }
.drawer-meta { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 13px; }
.drawer-close, .lightbox-close {
  width: 32px; height: 32px;
  font-size: 20px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
  cursor: pointer;
}
.drawer-body { flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; padding: 18px 22px 32px; }
.drawer-status { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.drawer-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.drawer-stat { padding: 10px; background: var(--page); border-radius: 4px; }
.drawer-stat label { display: block; color: var(--muted); font-size: 12px; }
.drawer-stat strong { display: block; margin-top: 4px; font-size: 13px; }
.drawer-section { padding: 16px 0; border-top: 1px solid var(--line); }
.drawer-section:first-child { padding-top: 0; border-top: 0; }
.drawer-section h3 { margin: 0 0 10px; font-size: 16px; }
.drawer-section h3 span { margin-left: 6px; color: var(--muted); font-size: 12px; font-weight: 400; }
.skeleton-groups { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.skeleton-group { padding: 10px; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; font-size: 13px; }
.skeleton-group strong { display: block; margin-bottom: 4px; color: var(--ink); }
.criteria-list, .check-list { display: flex; flex-direction: column; gap: 8px; }
.criterion-row { padding: 10px; background: var(--page); border-radius: 4px; }
.criterion-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.criterion-label { font-size: 14px; font-weight: 650; }
.criterion-group { margin-right: 6px; color: var(--blue); font-size: 12px; }
.criterion-basis, .criterion-boundary, .check-observation { margin-top: 6px; color: var(--muted); font-size: 13px; line-height: 1.55; }
.check-row { padding: 9px 10px; background: var(--page); border-left: 3px solid var(--line); }
.check-row.confirmed { border-color: var(--success); }
.check-row.manual_review { border-color: var(--warning); }
.check-row.not_confirmed { border-color: var(--error); }
.check-row.pending { border-color: var(--blue); }
.check-line { display: flex; justify-content: space-between; gap: 8px; }
.check-state { padding: 2px 6px; background: #fff; border-radius: 99px; font-size: 12px; }
.check-state.confirmed { color: var(--success); background: var(--success-bg); }
.check-state.manual_review { color: var(--warning); background: var(--warning-bg); }
.check-state.not_confirmed { color: var(--error); background: var(--error-bg); }
.check-state.pending { color: var(--blue); background: var(--blue-soft); }
.check-confidence { color: var(--muted); font-size: 12px; }
.check-reason { margin-top: 4px; color: var(--warning); font-size: 13px; }
.evidence-ref-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.evidence-ref {
  padding: 3px 7px;
  color: var(--blue);
  background: var(--blue-soft);
  border: 0;
  border-radius: 99px;
  cursor: zoom-in;
  font-size: 12px;
}
.evidence-expand.evidence-ref {
  display: inline-flex;
  padding: 6px 10px;
  color: var(--blue);
  background: #ffffff;
  border: 1px solid #bcd4f5;
  border-radius: 7px;
  box-shadow: 0 3px 8px rgba(0, 86, 210, .08);
  font-weight: 700;
}
.evidence-expand.evidence-ref:hover {
  color: #ffffff;
  background: var(--blue);
  border-color: var(--blue);
}
.risk-list { margin: 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
.unresolved { padding: 10px; color: #7a5200; background: var(--warning-bg); border-radius: 4px; font-size: 13px; }
.high-level { padding: 10px; color: var(--muted); background: var(--success-bg); border-left: 3px solid var(--success); font-size: 14px; }

.hover-preview {
  position: fixed;
  z-index: 60;
  width: 310px;
  padding: 8px;
  background: #fff;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  pointer-events: none;
}
.hover-preview img { display: block; width: 100%; height: 155px; object-fit: contain; background: var(--page); }
.hover-preview .preview-placeholder { display: grid; place-items: center; height: 155px; color: var(--faint); background: var(--page); }
.preview-meta { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: 12px; }
.lightbox { display: grid; place-items: center; padding: clamp(12px, 3vw, 32px); }
.lightbox-panel {
  position: relative;
  display: grid;
  grid-template-rows: minmax(0, 1fr) auto;
  width: min(1120px, 96vw);
  height: min(88dvh, 820px);
  min-height: 0;
  padding: 18px;
  overflow: hidden;
  background: #fff;
  border: 1px solid rgba(255, 255, 255, .65);
  border-radius: 14px;
  box-shadow: 0 28px 80px rgba(6, 24, 48, .32);
}
.lightbox-close { position: absolute; top: 12px; right: 12px; z-index: 2; border-radius: 8px; box-shadow: 0 4px 12px rgba(6, 24, 48, .12); }
#lightbox-media { display: grid !important; min-width: 0; min-height: 0; place-items: center; overflow: hidden; border-radius: 9px; background: #07172d; }
.lightbox #lightbox-media .evidence-video-wrap { width: 100%; height: 100%; aspect-ratio: auto; border: 0; border-radius: 0; }
.lightbox-image { flex: 1; width: 100%; min-height: 0; object-fit: contain; background: var(--page); }
.lightbox-video { display: block; width: 100%; height: 100%; min-height: 0; object-fit: contain; background: #07172d; }
.lightbox-placeholder { flex: 1; display: grid; place-items: center; color: var(--faint); background: var(--page); }
.lightbox-meta { min-height: 32px; padding: 10px 4px 0; color: var(--muted); font-size: 13px; }

.footer {
  margin-top: 4px;
  padding-top: 4px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  font-size: 11px;
  text-align: center;
}
.toast {
  position: fixed;
  right: 22px;
  bottom: 20px;
  z-index: 90;
  padding: 10px 14px;
  color: #fff;
  background: var(--ink);
  border-radius: 4px;
  font-size: 14px;
  opacity: 0;
  transform: translateY(8px);
  transition: 220ms ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: none; }

werSkeleton(item,detail,"逐条核验结果尚未提供。");body+=drawerEvidence(item);body+=drawerAnalysis(item);body+=drawerRisks(detail)}drawerBody.innerHTML=body;drawerBody.dataset.itemIndex=String(index);drawerBody.dataset.renderSignature=drawerSignature}$("drawer-backdrop").hidden=false;document.body.classList.add("locked");document.querySelectorAll(".detail-trigger").forEach(btn=>btn.setAttribute("aria-expanded",String(Number(btn.dataset.detailIndex)===index)));bindEvidenceInteractions();syncEvidencePlayers()}
function openDetail(index){current=index;render();pendingAutoplayIndex=index;renderDrawer(index);setTimeout(()=>$('drawer-close').focus(),0)}
function closeDetail(){pauseEvidencePlayers();drawerIndex=null;$("drawer-backdrop").hidden=true;document.body.classList.remove("locked");document.querySelectorAll(".detail-trigger").forEach(btn=>btn.setAttribute("aria-expanded","false"));pendingAutoplayIndex=current;syncEvidencePlayers()}
function findEvidenceFromButton(button){const item=state[Number(button.dataset.itemIndex)];return item?evidenceById(item,button.dataset.evidenceId):null}
function showHover(button,fromKeyboard=false){const evidence=findEvidenceFromButton(button);if(!evidence||evidence.kind==="video"||(!fromKeyboard&&window.matchMedia("(pointer:coarse)").matches))return;hoverButton=button;const media=$("hover-media");media.innerHTML=evidence.src?`<img src="${evidence.src}" alt="">`:`<div class="preview-placeholder">暂无图像</div>`;$("hover-phase").textContent=`${evidenceLabel(evidence)}${evidence.timestamp?` · ${evidence.timestamp}`:""}`;$("hover-confidence").textContent=confidenceText(evidence.confidence);const preview=$("hover-preview");preview.hidden=false;const rect=button.getBoundingClientRect(),width=Math.min(310,Math.max(120,window.innerWidth-24)),height=Math.min(270,Math.max(150,window.innerHeight-24));preview.style.width=`${width}px`;let left=rect.right+12,top=rect.top;if(left+width>window.innerWidth-12)left=rect.left-width-12;if(top+height>window.innerHeight-12)top=window.innerHeight-height-12;preview.style.left=`${Math.max(12,Math.min(left,Math.max(12,window.innerWidth-width-12)))}px`;preview.style.top=`${Math.max(12,Math.min(top,Math.max(12,window.innerHeight-height-12)))}px`}
function hideHover(){if(hoverTimer)clearTimeout(hoverTimer);hoverTimer=null;hoverButton=null;$("hover-preview").hidden=true}
function openLightbox(button){const evidence=findEvidenceFromButton(button);if(!evidence)return;hideHover();pauseEvidencePlayers();const media=$("lightbox-media");if(evidence.kind==="video")media.innerHTML=evidence.src?`<div class="evidence-video-wrap"><canvas class="evidence-video-backdrop" aria-hidden="true"></canvas><div class="evidence-video-shade" aria-hidden="true"></div><video class="lightbox-video evidence-video" data-evidence-video="true" data-item-index="${button.dataset.itemIndex}" data-evidence-id="${esc(evidence.evidence_id)}" src="${esc(evidence.src)}" controls muted loop playsinline></video><div class="video-playback-status" aria-live="polite"></div></div>`:`<div class="lightbox-placeholder">暂无视频</div>`;else media.innerHTML=evidence.src?`<img class="lightbox-image" src="${evidence.src}" alt="证据大图">`:`<div class="lightbox-placeholder">暂无图像</div>`;$("lightbox-meta").textContent=`${evidenceLabel(evidence)}${evidence.timestamp?` · ${evidence.timestamp}`:""} · 置信度 ${confidenceText(evidence.confidence)}`;$("lightbox").hidden=false;document.body.classList.add("locked");pendingAutoplayIndex=Number(button.dataset.itemIndex);syncEvidencePlayers();setTimeout(()=>$("lightbox-close").focus(),0)}
function closeLightbox(){pauseEvidencePlayers();$("lightbox-media").innerHTML="";$("lightbox").hidden=true;if(drawerIndex===null)document.body.classList.remove("locked");pendingAutoplayIndex=current;syncEvidencePlayers()}
function bindEvidenceInteractions(){document.querySelectorAll(".evidence-thumb,.evidence-ref").forEach(button=>{button.onpointerenter=event=>{if(event.pointerType==="touch")return;hoverTimer=setTimeout(()=>showHover(button),120)};button.onpointerleave=hideHover;button.onfocus=()=>{if(window.matchMedia("(pointer:coarse)").matches)return;hoverTimer=setTimeout(()=>showHover(button,true),120)};button.onblur=hideHover;button.onclick=()=>openLightbox(button)});syncEvidencePlayers()}
$("start").onclick=startEvaluation;$("reset").onclick=resetReport;$("drawer-close").onclick=closeDetail;$("lightbox-close").onclick=closeLightbox;$("drawer-backdrop").onclick=event=>{if(event.target===event.currentTarget)closeDetail()};$("lightbox").onclick=event=>{if(event.target===event.currentTarget)closeLightbox()};document.addEventListener("click",event=>{const detailButton=event.target.closest&&event.target.closest(".detail-trigger");if(detailButton){event.preventDefault();openDetail(Number(detailButton.dataset.detailIndex));return}if(event.target.closest&&event.target.closest(".timeline-btn,.timeline-toggle,.course-fab,.chip,.control,.evidence-thumb,.evidence-ref,.drawer-close,.lightbox-close"))return});document.addEventListener("keydown",event=>{if(event.key==="Escape"){if(!$('lightbox').hidden){closeLightbox();return}if(!$('drawer-backdrop').hidden){closeDetail();return}}if(event.key==="Tab"&&!$('drawer-backdrop').hidden){const focusables=[...$('detail-drawer').querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')];if(!focusables.length)return;const first=focusables[0],last=focusables[focusables.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus()}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus()}}});document.querySelectorAll("#difficultyFilters .chip").forEach(btn=>btn.onclick=()=>{if(!$("difficultyFilters").classList.contains("ready"))return;document.querySelectorAll("#difficultyFilters .chip").forEach(x=>x.classList.remove("active"));btn.classList.add("active");filter=btn.dataset.filter;renderCards();bindEvidenceInteractions()});
function setCourseCollapsed(collapsed){const layout=document.querySelector(".live-layout");if(!layout)return;layout.classList.toggle("timeline-collapsed",collapsed);const toggle=$("timelineToggle");if(toggle){toggle.setAttribute("aria-expanded",String(!collapsed));toggle.setAttribute("aria-label",collapsed?"展开课程内容":"收起课程内容");toggle.title=collapsed?"展开课程内容":"收起课程内容"}if($("courseFab"))$("courseFab").hidden=!collapsed}
if(evidenceMediaMode!=="video"&&$("timelineToggle"))$("timelineToggle").onclick=()=>setCourseCollapsed(!document.querySelector(".live-layout").classList.contains("timeline-collapsed"));
if(evidenceMediaMode!=="video"&&$("courseFab"))$("courseFab").onclick=()=>setCourseCollapsed(false);
if($("follow-chip"))$("follow-chip").onclick=jumpToLatestCompleted;
syncCanvasScale();

if(window.visualViewport)window.visualViewport.addEventListener("resize",syncCanvasScale,{passive:true});
